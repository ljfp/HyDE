# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

monitor = eDP-1, 1920x1200@60, 0x0, 1.5
monitor = DP-1, 3440x1440@60, auto-right, 1
monitor = HDMI-A-1, 3440x1440@100, auto-right, 1

# Lid closed: disable internal display, use external
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh closed
# Lid open: enable internal display, disable external
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh open
